<body>
  <header class="masthead">
    <a class="wordmark" href="./" aria-label="返回心动未读长篇"><span class="mark" aria-hidden="true">♡</span> 心动未读</a>
    <span class="masthead-caption">把日子过成自己的 <span class="small-divider" aria-hidden="true"></span> 成长样章</span>
    <a class="return-story" href="./">返回长篇</a>
  </header>
  <main>
    <section class="theater growth-theater" id="theater" data-shape="portrait" data-mode="start" aria-label="心动未读一周成长样章">
      <div class="scene-wash" id="scene-wash" aria-hidden="true"></div>
      <img class="artwork" id="artwork" src="v3-heroine-straight.webp" alt="黑色长直发的你站在春日街道上" fetchpriority="high">
      <div class="scene-shade" aria-hidden="true"></div>
      <button class="advance-surface" id="advance-surface" aria-label="继续下一段" disabled></button>
      <div class="scene-hud">
        <div class="scene-badge"><span class="chapter-number" id="day-number">七日</span><div><span class="chapter-label" id="day-label">从自己的生活开始</span><span class="place-label" id="place-label">上海 · 自由设计师</span></div></div>
        <div class="hud-actions"><button class="scene-menu top-link" id="week-button" hidden>这周</button><button class="scene-menu top-link" id="menu-button">菜单</button></div>
      </div>
      <div class="growth-status" id="growth-status" hidden aria-label="当前资源"><span id="cash-status"></span><span id="energy-status"></span><span id="strain-status"></span></div>
      <section class="growth-panel" id="panel" aria-label="安排生活"></section>
      <section class="dialogue" id="dialogue" hidden aria-label="当前片段">
        <div class="dialogue-heading"><span class="speaker-dot" aria-hidden="true"></span><strong id="speaker">你</strong><span class="speaker-caption" id="speaker-caption">自己的生活</span><span class="page-mark" id="page-mark"></span></div>
        <div class="dialogue-text" id="dialogue-text" aria-live="polite" aria-atomic="true"></div>
        <div class="dialogue-footer"><span class="save-indicator" id="save-indicator" title="本样章自动保存"></span><button class="next-button" id="next"><span id="next-label">继续</span><span class="next-diamond" aria-hidden="true">◇</span></button></div>
      </section>
      <div class="loading-note" id="loading-note" role="status" hidden>正在展开这一幕…</div>
    </section>
    <footer class="demo-footer"><p><span class="footer-line" aria-hidden="true"></span> 学到的方法，留给下一次选择。</p><span>成长样章 · 进度单独保存</span></footer>
  </main>
  <dialog class="sheet growth-sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-header"><div><span class="sheet-kicker">这一周，属于你</span><h2 id="sheet-title">这周</h2></div><button class="close-button" id="close-sheet" aria-label="关闭窗口">×</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p class="no-script">请开启 JavaScript 后安排这一周的生活。</p></noscript>
</body>
</html>
